<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hangman Game</title>

<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #121212;
    color: white;
  }

  #word {
    font-size: 30px;
    letter-spacing: 10px;
    margin: 20px;
  }

  #letters button {
    margin: 5px;
    padding: 10px;
    font-size: 16px;
    cursor: pointer;
    background: #1e1e1e;
    color: white;
    border: 1px solid #444;
  }

  #letters button:disabled {
    background: #555;
  }

  #status {
    margin-top: 20px;
    font-size: 20px;
  }

  canvas {
    background: black;
    margin-top: 20px;
  }

  a.restart {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    background: #00c853;
    border: none;
    color: white;
    text-decoration: none;
    cursor: pointer;
    border-radius: 4px;
  }

  a.restart:hover {
    text-decoration: underline;
  }

  #gameOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    z-index: 9999;
    justify-content: center;
    align-items: center;
    font-size: 50px;
    color: white;
    font-weight: bold;
  }
</style>
</head>

VVQ=="></audio>

<div id="gameOverlay"></div>

<script>
const words = ["apple", "mango", "grape", "banana", "orange",  "elephant","giraffe","dolphin","kangaroo","tiger","lion","zebra","penguin","bear","fox","wolf","rabbit","monkey","crocodile","eagle","owl","snake","turtle","horse", "leopard","usa", "canada", "mexico", "japan", "china", "india", "russia", "germany", "france", "italy", "spain", "portugal", "ireland", "uk", "south africa", "australia", "new zealand", "south korea", "iran", "turkey","watermelon", "pineapple", "strawberry", "blueberry", "lemon", "kiwi", "peach", "cherry", "pear", "plum", "raspberry","coconut", "apricot", "pomegranate", "fig"];
let selectedWord = "";
let guessedLetters = [];
let wrongGuesses = 0;
const maxWrong = 10;

const wordDiv = document.getElementById("word");
const lettersDiv = document.getElementById("letters");
const statusText = document.getElementById("status");
const overlay = document.getElementById("gameOverlay");

const canvas = document.getElementById("hangmanCanvas");
const ctx = canvas.getContext("2d");

const winSound = document.getElementById("winSound");
const loseSound = document.getElementById("loseSound");

function drawBase() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(10, 230); ctx.lineTo(190, 230);
  ctx.moveTo(50, 230); ctx.lineTo(50, 20);
  ctx.lineTo(130, 20);
  ctx.lineTo(130, 50);
  ctx.stroke();
}

// Draw hangman
function drawHangman(step) {
  ctx.strokeStyle = "white";

  if (step > 0) {
    ctx.beginPath();
    ctx.arc(130, 70, 20, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (step > 1) {
    ctx.beginPath();
    ctx.moveTo(130, 90); ctx.lineTo(130, 150);
    ctx.stroke();
  }
  if (step > 2) {
    ctx.beginPath();
    ctx.moveTo(130, 110); ctx.lineTo(100, 130);
    ctx.stroke();
  }
  if (step > 3) {
    ctx.beginPath();
    ctx.moveTo(130, 110); ctx.lineTo(160, 130);
    ctx.stroke();
  }
  if (step > 4) {
    ctx.beginPath();
    ctx.moveTo(130, 150); ctx.lineTo(100, 190);
    ctx.stroke();
  }
  if (step > 5) {
    ctx.beginPath();
    ctx.moveTo(130, 150); ctx.lineTo(160, 190);
    ctx.stroke();
  }
  if (step >= 6) {
    // Right leg
    ctx.beginPath();
    ctx.moveTo(130, 150);
    ctx.lineTo(160, 190);
    ctx.stroke();
  }
  if (step >= 7) {
    // Left eye
    ctx.beginPath();
    ctx.arc(120, 65, 3, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
  }
  if (step >= 8) {
    // Right eye
    ctx.beginPath();
    ctx.arc(140, 65, 3, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
  }
  if (step >= 9) {
    // Sad mouth (frown)
    ctx.beginPath();
    ctx.moveTo(125, 80);
    ctx.quadraticCurveTo(130, 70, 135, 80);
    ctx.stroke();

   
  if (step >= 10) {
  // Tears on the left eye
  ctx.beginPath();
  ctx.arc(115, 70, 2, 0, Math.PI * 2);
  ctx.fillStyle = "lightblue";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(115, 75, 2, 0, Math.PI * 2);
  ctx.fill();

  // Tears on the right eye
  ctx.beginPath();
  ctx.arc(145, 70, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(145, 75, 2, 0, Math.PI * 2);
  ctx.fill();

  // Optional: Add elongated tears
  ctx.beginPath();
  ctx.ellipse(115, 85, 2, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(145, 85, 2, 4, 0, 0, Math.PI * 2);
  ctx.fill();
}
}
}
function startGame() {
  selectedWord = words[Math.floor(Math.random() * words.length)];
  guessedLetters = [];
  wrongGuesses = 0;
  statusText.innerText = "Guess a letter!";
  createLetterButtons();
  updateWord();
  drawBase();
}

function createLetterButtons() {
  lettersDiv.innerHTML = "";
  for (let i = 97; i <= 122; i++) {
    let letter = String.fromCharCode(i);
    let btn = document.createElement("button");
    btn.innerText = letter;
    btn.onclick = () => {
      guessLetter(letter, btn);
    };
    lettersDiv.appendChild(btn);
  }
}

function guessLetter(letter, btn) {
  btn.disabled = true;

  if (selectedWord.includes(letter)) {
    guessedLetters.push(letter);
  } else {
    wrongGuesses++;
    drawHangman(wrongGuesses);
  }

  updateWord();
  checkGame();
}

function updateWord() {
  let display = "";
  for (let char of selectedWord) {
    display += guessedLetters.includes(char) ? char + " " : "_ ";
  }
  wordDiv.innerText = display;
}

function checkGame() {
  let won = selectedWord.split("").every(l => guessedLetters.includes(l));

  if (won) {
    statusText.innerText = "🎉 You Win!";
    winSound.currentTime = 0;
    winSound.play();
    overlay.innerText = "🎉 You Win!";
    overlay.style.display = "flex"; // Show overlay
    setTimeout(() => {
      overlay.style.display = "none";
    }, 2000);
    disableAllButtons();
  } else if (wrongGuesses >= maxWrong) {
    statusText.innerText = "💀 You Lost! Word: " + selectedWord;
    loseSound.currentTime = 0;
    loseSound.play();
    overlay.innerText = "💀 You Lost!";
    overlay.style.display = "flex"; // Show overlay
    setTimeout(() => {
      overlay.style.display = "none";
    }, 2000);
    disableAllButtons();
  } else {
    statusText.innerText = "Wrong guesses: " + wrongGuesses + " / " + maxWrong;
  }
}

function disableAllButtons() {
  document.querySelectorAll("#letters button").forEach(btn => btn.disabled = true);
}

startGame();
</script>
